# cry-wolf · 虚惊验收
# 每次推送:跑验收测试(58 tests:账坏网格/链边界/阈值恰线/薄账分层/as-of
# 回放/恒等式独立重算;dogfood:examples/worries.tsv 的字面值全部先手算再钉),
# 并输出 report/wolves/due/validate 与时间机器回放的快照。
# The snapshot never fails the build: it is a monitoring artifact,
# the tests are the gate. The sample ledger's WOLF alarm (exit 4) is the
# story itself — expected, not an error.
name: cry-wolf
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: acceptance tests (incl. dogfood ground-truth)
        run: python3 -m unittest discover -s cry-wolf/tests -v
      - name: example snapshot (advisory; report/wolves exit 4 by design)
        run: |
          python3 cry-wolf/cry_wolf.py report    --ledger cry-wolf/examples/worries.tsv || test $? -eq 4
          python3 cry-wolf/cry_wolf.py wolves    --ledger cry-wolf/examples/worries.tsv || test $? -eq 4
          python3 cry-wolf/cry_wolf.py due       --ledger cry-wolf/examples/worries.tsv
          python3 cry-wolf/cry_wolf.py validate  --ledger cry-wolf/examples/worries.tsv
          python3 cry-wolf/cry_wolf.py report    --ledger cry-wolf/examples/worries.tsv --as-of 2026-05-23 || test $? -eq 3
          python3 cry-wolf/cry_wolf.py wolves    --ledger cry-wolf/examples/worries.tsv --as-of 2026-05-23
      - name: snapshot byte-check (build reproducibility)
        run: python3 cry-wolf/examples/build_examples.py --check
