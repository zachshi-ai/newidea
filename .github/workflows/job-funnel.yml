# job-funnel · 求职漏斗
# 每次推送：跑验收测试（含 dogfood + 样例逐字节同步），并输出样例账本的漏斗快照。
# The funnel snapshot never fails the build: the report is a demo artifact,
# the aging gate (exit 4) is what can actually refuse something.
name: job-funnel
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: acceptance tests (incl. dogfood + examples sync)
        run: python3 -m unittest discover -s job-funnel/tests -v
      - name: funnel snapshot on the demo ledger (advisory)
        run: python3 job-funnel/job_funnel.py funnel job-funnel/examples/applications.csv --as-of 2025-12-01
