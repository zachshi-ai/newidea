# drift-apart · 渐行渐远
# 每次推送：跑验收测试（含 dogfood 样例逐字节校验），并输出当前友谊账本快照。
# The snapshot never fails the build: the report is a monitoring artifact,
# the tests are the gate.
name: drift-apart
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: acceptance tests (incl. examples sync)
        run: python3 -m unittest discover -s drift-apart/tests -v
      - name: friendship ledger snapshot (advisory)
        run: |
          cd drift-apart
          python3 drift_apart.py ledger examples/roster.csv examples/interactions.csv --as-of 2025-12-01
