# paper-shield · 纸盾
# 每次推送：跑验收测试（含 3-2-1 审计/backup→verify→drill 三层信任分级/
# 演练史/新鲜度榜/灾难推演等 43 项），逐字节校验账本与示例输出，并输出审计快照。
# The snapshot never fails the build: the report is a monitoring artifact,
# the tests are the gate (audit exits 4 by design; `|| test $? -eq 4`).
name: paper-shield
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: acceptance tests (incl. three-layer trust tiers)
        run: python3 -m unittest discover -s paper-shield/tests -v
      - name: examples byte-check (reproducible ledgers + outputs)
        run: python3 paper-shield/examples/build_examples.py --check
      - name: paper-shield snapshots (advisory, exit 4 by design)
        run: |
          python3 paper-shield/paper_shield.py audit    paper-shield/examples/targets.tsv paper-shield/examples/events.tsv --today 2026-09-04 || test $? -eq 4
          python3 paper-shield/paper_shield.py drills   paper-shield/examples/targets.tsv paper-shield/examples/events.tsv
          python3 paper-shield/paper_shield.py fresh    paper-shield/examples/targets.tsv paper-shield/examples/events.tsv
          python3 paper-shield/paper_shield.py simulate paper-shield/examples/targets.tsv paper-shield/examples/events.tsv dead disk
          python3 paper-shield/paper_shield.py validate paper-shield/examples/targets.tsv paper-shield/examples/events.tsv
