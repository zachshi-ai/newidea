# scapegoat · 替罪羊
# 每次推送：跑验收测试（含 2×2 卷宗/Fisher 精确检验/缺席条款/组合作案永不定罪/
# 反事实少发推演/--today 逐字节复现等 48 项），逐字节校验账本与示例输出，并输出审判快照。
# The snapshot never fails the build: the report is a monitoring artifact,
# the tests are the gate (verdicts exits 4 by design; `|| test $? -eq 4`).
name: scapegoat
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: acceptance tests (incl. Fisher exact + absence clauses)
        run: python3 -m unittest discover -s scapegoat/tests -v
      - name: examples byte-check (reproducible diary + outputs)
        run: python3 scapegoat/examples/build_examples.py --check
      - name: scapegoat snapshots (advisory, exit 4 by design)
        run: |
          python3 scapegoat/scapegoat.py verdicts  scapegoat/examples/diary.tsv --today 2026-08-24 || test $? -eq 4
          python3 scapegoat/scapegoat.py judge     scapegoat/examples/diary.tsv --trigger 缺睡
          python3 scapegoat/scapegoat.py case      scapegoat/examples/diary.tsv --date 2026-05-07
          python3 scapegoat/scapegoat.py combo     scapegoat/examples/diary.tsv
          python3 scapegoat/scapegoat.py acquitted scapegoat/examples/diary.tsv
          python3 scapegoat/scapegoat.py simulate  scapegoat/examples/diary.tsv --avoid 缺睡 --months 3
          python3 scapegoat/scapegoat.py validate  scapegoat/examples/diary.tsv
