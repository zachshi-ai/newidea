# social-jetlag · 社交时差验收
# 每次推送：跑验收测试（含 dogfood：提交的样例日志必须逐字节复现提交的样例报告），
# 并输出示例日志的两本账快照。
# The snapshot never fails the build: the report is a monitoring artifact,
# the tests are the gate.
name: social-jetlag
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: acceptance tests (incl. dogfood + examples sync)
        run: python3 -m unittest discover -s social-jetlag/tests -v
      - name: jetlag snapshot (advisory)
        run: python3 social-jetlag/social_jetlag.py report social-jetlag/examples/wooly-week.tsv
