# felt-inflation · 体感通胀
# 每次推送：跑验收测试（含 dogfood + 样例逐字节同步），并输出样例账本的通胀快照。
# The rate gate (exit 4 = annualized inflation over the red line) is what can
# actually refuse something; the report snapshots are advisory demo artifacts.
name: felt-inflation
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: acceptance tests (incl. dogfood + examples sync)
        run: python3 -m unittest discover -s felt-inflation/tests -v
      - name: felt inflation snapshot on the demo ledger (advisory)
        run: |
          python3 felt-inflation/felt_inflation.py rate felt-inflation/examples/ledger.tsv --base 2025-01 --period 2026-06 || true
          python3 felt-inflation/felt_inflation.py board felt-inflation/examples/ledger.tsv --base 2025-01 --period 2026-06
          python3 felt-inflation/felt_inflation.py drift felt-inflation/examples/ledger.tsv --base 2025-01 --period 2026-06
          python3 felt-inflation/felt_inflation.py power felt-inflation/examples/ledger.tsv --base 2025-01 --period 2026-06
