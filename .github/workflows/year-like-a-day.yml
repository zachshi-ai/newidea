# year-like-a-day · 度年如日
# 每次推送：跑验收测试（含样例逐字节同步 --check），并输出样例账本的初事快照。
# The greying gate (exit 4 = climate greying / absolute desert) is what can
# actually refuse something; the other report snapshots are advisory demos.
name: year-like-a-day
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: acceptance tests
        run: python3 -m unittest discover -s year-like-a-day/tests -v
      - name: examples byte-exact check
        run: python3 year-like-a-day/examples/build_examples.py --check
      - name: year-like-a-day snapshot on the demo ledger (advisory)
        run: |
          python3 year-like-a-day/year_like_a_day.py --today 2026-08-31 report year-like-a-day/examples/firsts.tsv || true
          python3 year-like-a-day/year_like_a_day.py --today 2026-08-31 months year-like-a-day/examples/firsts.tsv
          python3 year-like-a-day/year_like_a_day.py --today 2026-08-31 streaks year-like-a-day/examples/firsts.tsv
          python3 year-like-a-day/year_like_a_day.py --today 2026-08-31 sources year-like-a-day/examples/firsts.tsv
          python3 year-like-a-day/year_like_a_day.py --today 2026-08-31 simulate year-like-a-day/examples/firsts.tsv --every 7
          python3 year-like-a-day/year_like_a_day.py --today 2026-08-31 today year-like-a-day/examples/firsts.tsv || true
          python3 year-like-a-day/year_like_a_day.py --today 2026-08-31 gate year-like-a-day/examples/firsts.tsv || true
          python3 year-like-a-day/year_like_a_day.py --today 2026-08-31 validate year-like-a-day/examples/firsts.tsv
