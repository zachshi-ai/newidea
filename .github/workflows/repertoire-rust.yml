# repertoire-rust · 绝活生锈
# 每次推送：跑验收测试（含 dogfood + 样例逐字节同步），并输出样例账本的保鲜快照。
# The freshness snapshot never fails the build: the report is a demo artifact,
# the gig gate (exit 4) is what can actually refuse something.
name: repertoire-rust
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: acceptance tests (incl. dogfood + examples sync)
        run: python3 -m unittest discover -s repertoire-rust/tests -v
      - name: freshness snapshot on the demo ledger (advisory)
        run: python3 repertoire-rust/repertoire_rust.py fresh repertoire-rust/examples/gig-ledger.jsonl --as-of 2026-08-31
