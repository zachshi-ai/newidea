# shadow-base · 暗基数
# 每次推送：跑验收测试，并在样例账本上输出各命令快照（红灯命令是演示主体）。
# SHAVED / FLOOR-PAY / SHADOW MONTHS (exit 4) 是真实门禁；其余快照为 advisory 演示。
name: shadow-base
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: acceptance tests
        run: python3 -m unittest discover -s shadow-base/tests -v
      - name: snapshots on the demo ledger (red gates expected to exit 4)
        run: |
          python3 shadow-base/shadow_base.py report shadow-base/examples/ledger.tsv --wages shadow-base/examples/wages.tsv --require 12 --floor-value 5500 || true
          python3 shadow-base/shadow_base.py audit shadow-base/examples/ledger.tsv --wages shadow-base/examples/wages.tsv || true
          python3 shadow-base/shadow_base.py streak shadow-base/examples/ledger.tsv --require 12
          python3 shadow-base/shadow_base.py compare shadow-base/examples/ledger.tsv --wages shadow-base/examples/wages.tsv || true
          python3 shadow-base/shadow_base.py simulate shadow-base/examples/ledger.tsv quit 1 --require 12
          python3 shadow-base/shadow_base.py simulate shadow-base/examples/ledger.tsv bridge 1 --require 12
          python3 shadow-base/shadow_base.py validate shadow-base/examples/ledger.tsv
          python3 shadow-base/shadow_base.py report shadow-base/examples/ledger.tsv --wages shadow-base/examples/wages.tsv --as-of 2025-12 || true
