# nav-illusion · 净值幻觉
# 每次推送：跑验收测试（含 demo 数字核验 + 样例逐字节同步），并输出样例账本的数据体检快照。
# The status snapshot never fails the build: the demo report intentionally
# ends BLEEDING (exit 4) — that gate is pinned by the acceptance tests, and
# doctor (exit 0) is the advisory artifact shown here.
name: nav-illusion
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: acceptance tests (incl. dogfood + examples sync)
        run: python3 -m unittest discover -s nav-illusion/tests -v
      - name: data exam on the demo ledgers (advisory)
        run: python3 nav-illusion/nav_illusion.py doctor nav-illusion/examples/flows.csv nav-illusion/examples/navs.csv --as-of 2026-06-30
